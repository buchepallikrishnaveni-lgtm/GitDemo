<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple CMS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIGN UP PAGE -->

    <div id="signupPage" class="auth-page">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Sign up to manage your content</p>

            <form id="signupForm">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p class="switch">
                Already have an account?
                <button class="link-btn" onclick="showLogin()">
                    Login
                </button>
            </p>

        </div>

    </div>


    <!-- LOGIN PAGE -->

    <div id="loginPage" class="auth-page hidden">

        <div class="auth-box">

            <h1>Welcome Back</h1>

            <p>Login to your CMS account</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="switch">
                Don't have an account?
                <button class="link-btn" onclick="showSignup()">
                    Sign Up
                </button>
            </p>

        </div>

    </div>


    <!-- CMS PAGE -->

    <div id="cmsPage" class="hidden">

        <header>

            <div>
                <h1>My Content Manager</h1>
                <p>Create and manage your articles</p>
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </header>


        <main>

            <!-- Welcome -->

            <section class="welcome">

                <h2 id="welcomeMessage">
                    Welcome!
                </h2>

                <p>
                    Manage your articles from this dashboard.
                </p>

            </section>


            <!-- Add Article -->

            <section class="editor">

                <h2>Create Article</h2>

                <form id="articleForm">

                    <label>Article Title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter article title"
                        required
                    >


                    <label>Author</label>

                    <input
                        type="text"
                        id="author"
                        placeholder="Enter author name"
                        required
                    >


                    <label>Category</label>

                    <select id="category">

                        <option>Technology</option>
                        <option>Education</option>
                        <option>Travel</option>
                        <option>Health</option>

                    </select>


                    <label>Article Content</label>

                    <textarea
                        id="content"
                        placeholder="Write your article..."
                        required
                    ></textarea>


                    <button type="submit">
                        Publish Article
                    </button>

                </form>

            </section>


            <!-- Search -->

            <section class="search">

                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search articles..."
                >

            </section>


            <!-- Articles -->

            <section class="articles">

                <h2>Articles</h2>

                <div id="articleList"></div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
